# 这里只选择目录项，profile 不授予网络权限。秒与毫秒不可混用。
schema_version = 1
[limits]
max_concurrency = 6
per_host = 2
logical_gets_per_target = 1
extra_attempts_per_target = 1
max_redirects = 0
max_body_bytes = 16777216
v6_fallback_after_ms = 8000
min_interval_ms = 4000
batch_size = 5
udp_quic_concurrency = 1
tcp_concurrency = 3
batch_cooldown_ms = 45000
node_retest = 1

[[profiles]]
id = "simple"
# 默认不限时：总时长只受单请求 request_timeout_ms 与 QoS 节奏约束。
# 用户可用 --timeout / GUI「最大检测时长」显式设上限（0 = 不限时）。
ids = ["google.home", "google.gemini", "google.youtube", "google.play", "google.gmail", "google.accounts", "google.news", "google.drive", "google.books", "google.one", "control.chatgpt", "control.claude", "control.netflix", "control.rail12306", "control.taobao", "control.bilibili"]
run_timeout_ms = 0
request_timeout_ms = 10000
max_concurrency = 4
per_host = 2

[[profiles]]
id = "google-all"
namespace = "google"
run_timeout_ms = 120000
request_timeout_ms = 12000
max_concurrency = 6
per_host = 2

[[profiles]]
id = "full"
namespace = "all"
run_timeout_ms = 120000
request_timeout_ms = 12000
max_concurrency = 6
per_host = 2
