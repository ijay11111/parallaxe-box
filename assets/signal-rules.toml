# 阶段1 · 只读提取与安全停步特征；不是在线许可。匹配范围须和目录引用同时成立。
schema_version = 1
[detection]
login_hosts = ["accounts.google.com", "accounts.youtube.com", "myaccount.google.com"]
login_context_hosts = ["mail.google.com", "drive.google.com", "calendar.google.com"]
login_path_prefixes = ["/signin/", "/v3/signin/", "/ServiceLogin"]
consent_hosts = ["consent.google.com", "consent.youtube.com"]
consent_markers = ["Before you continue to Google", "Before you continue to YouTube"]
captcha_path_prefixes = ["/sorry/", "/recaptcha/"]
challenge_markers = ["unusual traffic from your computer network"]
rate_limit_status = [429]
auth_or_denied_status = [401, 403]
allowed_html_types = ["text/html", "application/xhtml+xml"]
allowed_json_types = ["application/json"]
min_text_bytes = 1
max_body_bytes = 16777216
require_complete_for_content = true
source = "docs/research/03-google-matrix.md；docs/research/05-signals.md；候选停步特征而非准入或国家证据"

