[[rules]]
id = "rule.tos-loc"
version = 1
enabled = true
layer = "SERVICE_POLICY"
channel = "SERVICE"
credibility = "MEDIUM"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "Google 服务条款链接按访问 IP 动态生成的 loc 地区参数；实测 accounts/drive 页脚 TOS?loc=XX 与出口地区一致"
negative_case = "用户自带 loc 参数不算观察；不证明账号国家或订阅资格"
extract = { kind = "regex", pattern = "accounts\\.google\\.com/TOS\\?loc=([A-Z]{2})", capture = "1" }
applies_to = [
  { target_id = "google.accounts", host = "accounts.google.com", path = "/", surface = "登录入口：首跳主机/状态" },
  { target_id = "google.one", host = "one.google.com", path = "/", surface = "公开说明/目录：状态或新入口" },
]

[[rules]]
id = "rule.one-region"
version = 1
enabled = true
layer = "SERVICE_POLICY"
channel = "SERVICE"
credibility = "MEDIUM"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "Google One 地区选择按钮按访问 IP 显示当前地区（aria-label）；实测研究型 UA 可读"
negative_case = "用户手动选区不算观察；该值按 IP 变化，不代表账号订阅地区"
extract = { kind = "regex", pattern = "aria-label=\"([A-Za-z ]+)\\. Choose your country or region", capture = "1" }
applies_to = [
  { target_id = "google.one", host = "one.google.com", path = "/", surface = "公开说明/目录：状态或新入口" },
]

[[rules]]
id = "rule.play-footer"
version = 1
enabled = true
layer = "SERVICE_POLICY"
channel = "SERVICE"
credibility = "MEDIUM"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "Play 商店页脚按访问 IP 显示的国家/语言（如 China (English (United States))）；实测研究型 UA 可读"
negative_case = "账号登录后地区跟账号走；匿名仅反映 IP 侧展示，不代表 Play 账号国家"
extract = { kind = "regex", pattern = ">([A-Z][a-zA-Z ]+ \\(English[^<]*\\))</div>", capture = "1" }
applies_to = [
  { target_id = "google.play", host = "play.google.com", path = "/store", surface = "商店 HTML：国旗资源及配对文案" },
]

[[rules]]
id = "rule.yt-gl"
version = 1
enabled = true
layer = "PREFERENCE"
channel = "SERVICE"
credibility = "MEDIUM"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "仅 YouTube 页面内容版次"
negative_case = "同意页中的 GL 不作版次证据"
extract = { kind = "regex", pattern = "\"GL\":\"([A-Z]{2})\"", capture = "1" }
applies_to = [
  { target_id = "google.youtube", host = "www.youtube.com", path = "/", surface = "媒体配置：HTML 中 GL" },
  { target_id = "google.yt-music", host = "music.youtube.com", path = "/", surface = "媒体配置：HTML 中 GL" },
]

[[rules]]
id = "rule.flag"
version = 1
enabled = true
layer = "PREFERENCE"
channel = "SERVICE"
credibility = "LOW"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "只记录素材，不证明已选商店国家"
negative_case = "多个国旗或仅有图标不认定为付款国家"
extract = { kind = "regex", pattern = "regionflags/([a-z]{2})\\.png", capture = "1" }
applies_to = [
  { target_id = "google.play", host = "play.google.com", path = "/store", surface = "商店 HTML：国旗资源及配对文案" },
  { target_id = "google.play-apps", host = "play.google.com", path = "/store/apps", surface = "商店 HTML：国旗资源及配对文案" },
]

[[rules]]
id = "rule.footer"
version = 1
enabled = true
layer = "EGRESS_NETWORK"
channel = "SERVICE"
credibility = "HIGH"
source_grade = "OFFICIAL_DOC"
notes = "只识别来源标签；不收地点或地址"
negative_case = "设备/历史来源标签不是 IP 证据"
extract = { kind = "text_label", pattern = "From your internet address", capture = "value" }
applies_to = [
  { target_id = "google.search", host = "www.google.com", path = "/search", surface = "搜索入口：是否明确标来源" },
]

[[rules]]
id = "rule.empty"
version = 1
enabled = true
layer = "EGRESS_NETWORK"
channel = "TRANSPORT"
credibility = "HIGH"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "空体长度，只作链路证据"
negative_case = "204 不带地区头不推国家"
extract = { kind = "body_length", pattern = "body_bytes", capture = "value" }
applies_to = [
  { target_id = "google.http204", host = "www.google.com", path = "/generate_204", surface = "204：响应体长度及疑似地区头" },
]

[[rules]]
id = "rule.trace"
version = 1
enabled = true
layer = "EGRESS_NETWORK"
channel = "SERVICE"
credibility = "HIGH"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "仅该接收方；loc 和 colo 分开，IP 只记存在"
negative_case = "colo 不能填 loc；真实 ip 不持久化"
extract = { kind = "text_kv", pattern = "loc,colo,http,tls,ip_present", capture = "value" }
applies_to = [
  { target_id = "control.cf-trace", host = "one.one.one.one", path = "/cdn-cgi/trace", surface = "CDN · Cloudflare trace" },
]

[[rules]]
id = "rule.meta"
version = 1
enabled = true
layer = "EGRESS_NETWORK"
channel = "SERVICE"
credibility = "NONE"
source_grade = "INFERENCE"
notes = "候选字段；本次 403 无有效样本"
negative_case = "本次仅 403；拒绝样本不能填 JSON 字段"
extract = { kind = "json", pattern = "country,colo,asn", capture = "value" }
applies_to = [
  { target_id = "control.cf-meta", host = "speed.cloudflare.com", path = "/meta", surface = "CDN · Cloudflare speed meta" },
]

[[rules]]
