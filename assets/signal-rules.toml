[[rules]]
id = "rule.inline3"
version = 1
enabled = true
layer = "SERVICE_POLICY"
channel = "SERVICE"
credibility = "LOW"
source_grade = "DIRECT_ANONYMOUS_OBSERVATION"
notes = "未公开的页面内联片段，不证明资格"
negative_case = "截断或非预期表面不匹配；三字码不证明资格"
