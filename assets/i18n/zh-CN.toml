"eligibility.gate.account_type_personal" = "Google One 与 AI Plus/Pro/Ultra 面向个人 Google 账号；Workspace/教育/企业账号需要管理员配置附加组件，不能直接按消费者订阅购买。"
"eligibility.gate.region_list_independent" = "各产品的可用地区清单是独立维护的（Google One、AI Plus/Pro/Ultra、Gemini API、AI Studio、NotebookLM、Flow、YouTube Premium 等并不等价），能访问页面不代表在当前地区可订阅。"
"eligibility.gate.age_13_plus" = "基础资格通常要求达到 13 岁或当地法定年龄；学校账号还可能受组织策略限制。"
"eligibility.gate.age_18_plus_ai" = "多项 AI 功能（如 AI Studio、Antigravity、Flow、深度研究等）要求 18 岁以上，具体以官方功能清单为准。"
"eligibility.gate.network_modifier" = "Google 可检测 VPN、代理或 DNS 修改器；订阅流程可能因检测到网络修改而被拒绝，链路可达不代表订阅环节一定通过。"
"eligibility.gate.payment_profile_country" = "Play 国家按账号注册国而非当前物理位置判定；首次设定后通常需等待 90 天才能更改，且需要当地支付方式，家庭组成员另有约束。"
"eligibility.gate.third_party_subscription" = "通过第三方合作伙伴、运营商或促销渠道获得的 Google One 订阅，可能无法直接升级到 AI Pro；已有独立 YouTube Premium 时捆绑权益也可能不激活。"
"eligibility.gate.family_group" = "已是 Google One 家庭组成员的账号不能重复开通个人订阅；家庭组状态与共享资格会影响可购买的套餐。"
"eligibility.gate.plan_content_differences" = "套餐权益并不等同于完整产品：AI Pro 捆绑的 YouTube Premium Lite 与 AI Ultra 的完整 Premium 不同，折扣附加组件也只在部分国家提供。"
"eligibility.gate.workspace_admin_ou" = "Workspace 管理员可按组织单位或用户组开关 Gemini、NotebookLM 等能力；具体版别（Business/Enterprise/Education）决定可用功能与配额。"
"eligibility.gate.education_under_18" = "Education 账号的未成年人默认可能无法使用 Gemini/Studio 等部分功能；学校账号通常不具备消费者订阅资格。"
"eligibility.gate.api_billing" = "Gemini API 与部分 Cloud 服务需要绑定结算账号或满足免费层资格；EEA、瑞士、英国等地区可能必须使用付费服务。"
"eligibility.gate.api_free_tier_limits" = "免费层按项目而非按 key 计算限额，内容可能用于改进产品并可能被人工审阅；429 可能只是免费额度耗尽，不代表服务不可用。"
"eligibility.gate.play_country" = "Google Play 的国家/地区由账号注册国决定，应用与内容按该国家分发；部分品类还需要逐国牌照与地理围栏。"
"eligibility.gate.play_developer_verification" = "Play Console 的开发者验证、年龄与地区要求正在分国生效；开发者账号资格与普通用户订阅资格是两套规则。"
"eligibility.gate.media_travel_region" = "YouTube Premium/Music 的可用清单、Lite/学生/年付清单并不相同；长期旅行（通常超过 30 天）或移居可能影响订阅，使用 VPN 伪装地区可能导致订阅被取消。"
"eligibility.gate.search_region_differences" = "搜索与内容结果受界面语言、搜索语言、地区偏好、设备、个性化与数据中心影响；访问某个国家域名不会切换到该国的独立索引。"
"eligibility.gate.maps_api_billing" = "Google Maps Platform 的 API key 通常必须绑定 Cloud 结算账号，即使仍在免费额度内；无 key 的 iframe 嵌入是另一套规则。"
"eligibility.gate.identity_risk" = "登录页可达不等于账号没有风控；验证码、手机验证、impossible travel、共享出口或数据中心 IP 都可能触发额外验证。"
"eligibility.gate.cloud_starter_tier" = "Cloud Starter Tier 通常要求个人账号、无付费 Cloud Billing 历史且位于支持地区；部分服务在没有结算账号时不可用。"
"eligibility.gate.ai_plan_entitlement" = "google.ai-plans 是 AI 计划的资格入口；Gemini、NotebookLM、AI Studio、Flow、Antigravity 等各自还有独立的产品可用清单。"
"eligibility.gate.antigravity_enterprise" = "Antigravity 对企业账号通常需要管理员显式开通；企业登录方式与独立 IDE 的支持范围可能不同。"
"eligibility.gate.static_no_gate" = "静态资源通常没有订阅资格闸门，但 CDN 内容可能因地区不同；本工具只把它当作网络观测事实，不作为资格证据。"

