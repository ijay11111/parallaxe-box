"eligibility.gate.account_type_personal" = "Google One and AI Plus/Pro/Ultra are for personal Google Accounts. Workspace, Education and enterprise accounts need an administrator-managed add-on and cannot simply buy the consumer plan."
"eligibility.gate.region_list_independent" = "Availability lists are maintained per product (Google One, AI Plus/Pro/Ultra, Gemini API, AI Studio, NotebookLM, Flow, YouTube Premium and others are not equivalent). Opening a page does not prove the subscription is available in your region."
"eligibility.gate.age_13_plus" = "Basic eligibility usually requires age 13 or the local legal age; school accounts may also be restricted by organization policy."
"eligibility.gate.age_18_plus_ai" = "Several AI features (such as AI Studio, Antigravity, Flow and Deep Research) require age 18+. Check the official feature list for details."
"eligibility.gate.network_modifier" = "Google can detect VPNs, proxies or DNS modifiers. A subscription flow may be rejected when a network modifier is detected; reachability does not guarantee the purchase step will pass."
"eligibility.gate.payment_profile_country" = "Google Play country is determined by the account's registered country, not the current physical location. It usually cannot change for 90 days, requires a local payment method, and family members have additional constraints."
"eligibility.gate.third_party_subscription" = "Google One subscriptions obtained through third-party partners, carriers or promotions may not be upgradable to AI Pro; bundled YouTube Premium benefits may also stay inactive if you already have a separate subscription."
"eligibility.gate.family_group" = "An existing Google One family-group member cannot open a separate personal subscription; family membership and sharing eligibility affect which plans can be purchased."
"eligibility.gate.plan_content_differences" = "Plan benefits are not the full product: AI Pro bundles YouTube Premium Lite, while AI Ultra includes the full Premium; discount add-ons are only offered in some countries."
"eligibility.gate.workspace_admin_ou" = "Workspace administrators can enable or disable Gemini, NotebookLM and related capabilities per organizational unit or group. The edition (Business/Enterprise/Education) determines available features and quotas."
"eligibility.gate.education_under_18" = "Education accounts for minors may have Gemini/Studio features disabled by default; school accounts generally are not eligible for consumer subscriptions."
"eligibility.gate.api_billing" = "Gemini API and some Cloud services require a billing account or free-tier eligibility; in the EEA, Switzerland and the UK a paid service may be mandatory."
"eligibility.gate.api_free_tier_limits" = "Free-tier quotas apply per project, not per key. Free content may be used to improve products and may be reviewed by humans; a 429 can simply mean the free quota is exhausted."
"eligibility.gate.play_country" = "Google Play country is based on the account's registered country, and apps/content are distributed for that country. Some categories also require per-country licenses and geofencing."
"eligibility.gate.play_developer_verification" = "Play Console developer verification, age and regional requirements are rolling out country by country; developer eligibility and consumer subscription eligibility are separate rules."
"eligibility.gate.media_travel_region" = "YouTube Premium/Music availability lists differ, and Lite/student/annual lists are shorter. Extended travel (usually over 30 days) or relocation may affect a subscription, and using a VPN to misrepresent location may lead to cancellation."
"eligibility.gate.search_region_differences" = "Search and content results depend on interface language, search language, region preference, device, personalization and data-center rollout. Visiting a country domain does not switch to a separate national index."
"eligibility.gate.maps_api_billing" = "Google Maps Platform API keys generally require a linked Cloud billing account even within the free credit; keyless iframe embeds follow different rules."
"eligibility.gate.identity_risk" = "A reachable sign-in page does not mean the account has no risk controls. CAPTCHAs, phone verification, impossible travel, shared egress or data-center IPs may trigger additional checks."
"eligibility.gate.cloud_starter_tier" = "Cloud Starter Tier usually requires a personal account, no paid Cloud Billing history and a supported territory; some services are unavailable without a billing account."
"eligibility.gate.ai_plan_entitlement" = "google.ai-plans is the AI-plan eligibility entry. Gemini, NotebookLM, AI Studio, Flow and Antigravity each maintain their own product availability lists."
"eligibility.gate.antigravity_enterprise" = "Antigravity for enterprise accounts usually requires explicit administrator provisioning; enterprise sign-in and standalone IDE support may differ."
"eligibility.gate.static_no_gate" = "Static resources usually have no subscription gate, but CDN content may differ by region. This tool treats them as network observations, not eligibility evidence."

