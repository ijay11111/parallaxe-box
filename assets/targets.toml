# Parallaxe box · v1 注册目录；不是联网许可或执行规则。详见 docs/architecture/03-schemas.md。
schema_version = 1
[defaults]
method = "GET"
precondition = "ANONYMOUS_ONLY"
request_budget = 1
max_body_bytes = 16777216
max_redirects = 0
stale_misses = 3
source_type = "DIRECT_ANONYMOUS_OBSERVATION"
verified_at = 2026-11-21
[admission]
# 仅发行审查层可提供精确表面许可。外部 TOML 无权写此表。
