[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/agent", "crates/gui"]

[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ijay11111/parallaxe-box"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
regex = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
fs2 = "0.4"
if-addrs = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
comfy-table = "7"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
eframe = { version = "0.29", features = ["android-game-activity"] }
egui = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
