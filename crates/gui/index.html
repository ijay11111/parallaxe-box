<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallaxe box · Web（只读）</title>
  <link data-trunk rel="icon" type="image/png" href="../../assets/icons/icon-64.png" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      background: #11131a;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: #c9ccd6;
    }
    #parallaxe_canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    noscript { padding: 24px; line-height: 1.8; }
  </style>
</head>
<body>
  <canvas id="parallaxe_canvas"></canvas>
  <noscript>Parallaxe box Web 端需要启用 JavaScript；本端只做离线解释，不发送网络请求。</noscript>
  <link data-trunk rel="rust" />
</body>
</html>
